[project]
name = "ollama-agent"
version = "1.0.0"
description = "Wonder Realm（奇想界域）：基于本机 Ollama 的三模式对话应用"
license = { text = "MIT" }
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
    "uvicorn>=0.53.0",
]

[dependency-groups]
# 打包用（见 DEVELOPMENT §8.4）：把后端收成 exe，运行时不需要它
dev = ["pyinstaller>=6.11"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
