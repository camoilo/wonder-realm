ollama:
  base_url: http://localhost:11434
  model: ""                      # 首次使用不预选模型（留空），由用户在顶栏自己选；
                                 # 之后每次启动沿用上次的选择（存在库里的 app_settings）
  options:
    temperature: 0.9               # 兜底值：对话实际用会话的“发散程度”档位（标准档 = 0.9），
                                   # 记忆压缩与自动命名各自压到 0.3；这里改小也不影响它们
    num_ctx: 32768                 # 上下文窗口（token）。Ollama 默认 4096，这里显式加大；
                                   # 超窗时 Ollama 会从最前面静默截断，所以要与 memory 的
                                   # 压缩阈值配套调整（改动前先看 DEVELOPMENT §9.5 提示词与解析）

memory:
  model: ""                       # 压缩用模型默认值，空 = 同对话模型；运行时可改
  compress_threshold_chars: 20000 # 未归档上下文超过该字符数触发压缩（中文约 1.33 字/token）
  archive_batch_size: 20          # 每次归档的消息条数
  max_memory_chars: 600           # 记忆摘要长度上限（写入提示词约束）

character_gen:
  timeout: 600                    # 让模型生成角色的等待上限（秒）。思考型模型开着思考会很慢
                                  # （实测常见 60 秒，偶发超过 300 秒），嫌久可开生成前关掉思考模式

chat:
  history_max_messages: 60        # 注入历史的最大条数（截断最早的）

naming:
  model: ""                       # 会话自动命名用模型，空 = 同对话模型
  max_chars: 12                   # 自动标题的字数上限
  min_user_chars: 8               # 用户累计发言少于该字数时先不命名，等后续轮次

server:
  host: 0.0.0.0                      # 0.0.0.0 = 局域网可访问（手机等设备走 http://<本机局域网IP>:17800）；
                                     # 只本机用可改回 127.0.0.1。改动后需重启应用生效
  port: 17800                       # 避开 8000/8080 等最容易被其他项目先占用的开发端口

backup:
  dir: ./backups                    # 备份目录；相对路径按项目根目录解析，可改成别的盘或网盘同步目录
  days: 14                          # 保留最近多少个自然日的备份（每次启动都备，一天可能多份）
  on_startup: true                  # 每次启动应用时自动备份一份

data_dir: ./data                  # 数据库目录，直接指定
